<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E9BAD"/>
      <stop offset="1" stop-color="#5B677A"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE78F"/>
      <stop offset="1" stop-color="#FFD24A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECDF"/>
    </linearGradient>
    <radialGradient id="pin" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#FF8F80"/>
      <stop offset=".55" stop-color="#E0301F"/>
      <stop offset="1" stop-color="#9E1209"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a0f18" flood-opacity=".45"/>
    </filter>
    <filter id="pin-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="string-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#0a0f18" flood-opacity=".5"/>
    </filter>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#board)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
  </g>
  <g id="layer-1">
    <g transform="rotate(-5 300.0 342.5)" filter="url(#card-shadow)">
      <rect x="120" y="205" width="360" height="275" rx="14" fill="url(#note)"/>
    </g>
    <g transform="rotate(5 720.0 325.0)" filter="url(#card-shadow)">
      <rect x="545" y="190" width="350" height="270" rx="14" fill="url(#card)"/>
    </g>
    <g transform="rotate(-2 515.0 700.0)" filter="url(#card-shadow)">
      <rect x="330" y="565" width="370" height="270" rx="14" fill="url(#card)"/>
    </g>
  </g>
  <g id="layer-2">
    <path d="M225 300 Q515.0 355.0 805 330 Q670.0 555.0 535 700 Q380.0 540.0 225 300" fill="none" stroke="#7A0E0A" stroke-width="58" stroke-linecap="round" filter="url(#string-shadow)"/>
    <path d="M225 300 Q515.0 355.0 805 330 Q670.0 555.0 535 700 Q380.0 540.0 225 300" fill="none" stroke="#E5322A" stroke-width="48" stroke-linecap="round"/>
  </g>
  <g id="layer-3">
    <g>
      <ellipse cx="237" cy="336.1" rx="38" ry="20.9" fill="#000" opacity=".3" filter="url(#pin-shadow)"/>
      <circle cx="225" cy="300" r="38" fill="url(#pin)"/>
      <ellipse cx="213.6" cy="284.8" rx="14.44" ry="8.36" fill="#fff" opacity=".85" transform="rotate(-30 213.6 284.8)"/>
    </g>
    <g>
      <ellipse cx="817" cy="366.1" rx="38" ry="20.9" fill="#000" opacity=".3" filter="url(#pin-shadow)"/>
      <circle cx="805" cy="330" r="38" fill="url(#pin)"/>
      <ellipse cx="793.6" cy="314.8" rx="14.44" ry="8.36" fill="#fff" opacity=".85" transform="rotate(-30 793.6 314.8)"/>
    </g>
    <g>
      <ellipse cx="547" cy="736.1" rx="38" ry="20.9" fill="#000" opacity=".3" filter="url(#pin-shadow)"/>
      <circle cx="535" cy="700" r="38" fill="url(#pin)"/>
      <ellipse cx="523.6" cy="684.8" rx="14.44" ry="8.36" fill="#fff" opacity=".85" transform="rotate(-30 523.6 684.8)"/>
    </g>
  </g>
</svg>
