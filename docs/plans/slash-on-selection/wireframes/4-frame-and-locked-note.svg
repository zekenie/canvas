<text x="54" y="289.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1F1F1E" font-weight="400" text-anchor="start">/</text>
<line x1="64.53" y1="275" x2="64.53" y2="293" stroke="#2F6FEB" stroke-width="2"/>
<text x="336" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">Roadmap</text>
