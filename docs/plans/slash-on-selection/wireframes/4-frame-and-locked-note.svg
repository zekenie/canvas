<path d="M652,92 v-2.5 a3,3 0 0 1 6,0 v2.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<rect x="435" y="107" width="240" height="110" rx="10" fill="none" stroke="#2F6FEB" stroke-width="2" />
<rect x="440" y="236" width="280" height="36" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<text x="454" y="259.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1F1F1E" font-weight="400" text-anchor="start">/</text>
<line x1="464.53" y1="245" x2="464.53" y2="263" stroke="#2F6FEB" stroke-width="2"/>
<text x="706" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">Groceries</text>
<rect x="448" y="280" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<rect x="453" y="287" width="190" height="28" rx="5" fill="#2F6FEB" stroke="none" stroke-width="1" />
<text x="464" y="306.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">unlock</text>
<text x="448" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">A locked note offers the one command</text>
<text x="448" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">that can act on it. (Its text can&#x27;t be</text>
<text x="448" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">typed in, so /unlock was unreachable.)</text>
</svg>
