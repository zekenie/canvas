<rect x="35" y="87" width="310" height="160" rx="10" fill="none" stroke="#2F6FEB" stroke-width="2" />
<rect x="52" y="80" width="74.875" height="24" rx="12" fill="#E9E9E4" stroke="#B6B6AE" stroke-width="1" />
