<text x="64" y="366.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">title</text>
<text x="324" y="366.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">title</text>
<text x="64" y="396.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">lock</text>
<text x="64" y="426.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">public</text>
<text x="64" y="456.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">color</text>
<text x="324" y="456.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">color</text>
<text x="64" y="486.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">move-to</text>
<text x="324" y="486.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">@frame or subboard</text>
<text x="64" y="516.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">move-near</text>
<text x="324" y="516.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">@shape</text>
<rect x="440" y="112" width="230" height="100" rx="4" fill="#FDF1B6" stroke="#E3CF78" stroke-width="1" filter="url(#soft)"/>
<text x="454" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3B3523" font-weight="600" text-anchor="start">Groceries</text>
