<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img">
<title>Press / with a note selected: the command bar opens under it</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9D9D3"/></pattern>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/></filter>
<filter id="soft" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A73"/></marker>
</defs>
<rect x="0" y="0" width="760" height="530" rx="10" fill="#F4F4F1" stroke="#E4E4DE" stroke-width="1" />
<rect x="0" y="0" width="760" height="530" rx="10" fill="url(#dots)" stroke="none" stroke-width="1" />
<text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1F1F1E" font-weight="700" text-anchor="start">Press / with a note selected</text>
<rect x="40" y="80" width="230" height="120" rx="4" fill="#FDF1B6" stroke="#E3CF78" stroke-width="1" filter="url(#soft)"/>
<text x="54" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3B3523" font-weight="600" text-anchor="start">Groceries</text>
<text x="54" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#3B3523" font-weight="400" text-anchor="start">milk, eggs, coffee</text>
<rect x="35" y="75" width="240" height="130" rx="10" fill="none" stroke="#2F6FEB" stroke-width="2" />
<rect x="40" y="222" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<text x="54" y="245.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1F1F1E" font-weight="400" text-anchor="start">/</text>
<line x1="64.53" y1="231" x2="64.53" y2="249" stroke="#2F6FEB" stroke-width="2"/>
<text x="356" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">Groceries</text>
<rect x="48" y="266" width="300" height="222" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<rect x="53" y="273" width="290" height="28" rx="5" fill="#2F6FEB" stroke="none" stroke-width="1" />
<text x="64" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">title</text>
<text x="334" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#E6EEFF" font-weight="400" text-anchor="end">title</text>
<text x="64" y="322.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">lock</text>
<text x="64" y="352.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">public</text>
<text x="64" y="382.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">is-a</text>
<text x="334" y="382.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">type</text>
<text x="64" y="412.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">color</text>
<text x="334" y="412.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">color</text>
<text x="64" y="442.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">move-to</text>
<text x="334" y="442.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">@frame or subboard</text>
<text x="64" y="472.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">move-near</text>
<text x="334" y="472.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">@shape</text>
<text x="420" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">The note stays selected.</text>
<path d="M412,108 L282,140" stroke="#B4B4AC" stroke-width="1" fill="none"/>
<circle cx="282" cy="140" r="2.5" fill="#B4B4AC"/>
<text x="420" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">The command bar opens right under</text>
<text x="420" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">the selection. It keeps this size at</text>
<text x="420" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">every zoom.</text>
<path d="M412,232 L376,240" stroke="#B4B4AC" stroke-width="1" fill="none"/>
<circle cx="376" cy="240" r="2.5" fill="#B4B4AC"/>
<text x="420" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">The same list a / opens inside a</text>
<text x="420" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">note today, in the same order.</text>
<path d="M412,326 L354,330" stroke="#B4B4AC" stroke-width="1" fill="none"/>
<circle cx="354" cy="330" r="2.5" fill="#B4B4AC"/>
<text x="420" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">Type to narrow it. Return runs</text>
<text x="420" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">the highlighted command.</text>
</svg>
