<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img">
<title>Naming a shape in the bar</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9D9D3"/></pattern>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/></filter>
<filter id="soft" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A73"/></marker>
</defs>
<rect x="0" y="0" width="760" height="400" rx="10" fill="#F4F4F1" stroke="#E4E4DE" stroke-width="1" />
<rect x="0" y="0" width="760" height="400" rx="10" fill="url(#dots)" stroke="none" stroke-width="1" />
<text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1F1F1E" font-weight="700" text-anchor="start">Name a shape with @</text>
<rect x="40" y="80" width="130" height="70" rx="4" fill="#FDF1B6" stroke="#E3CF78" stroke-width="1" filter="url(#soft)"/>
<text x="54" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3B3523" font-weight="600" text-anchor="start">Milk</text>
<rect x="35" y="75" width="140" height="80" rx="10" fill="none" stroke="#2F6FEB" stroke-width="2" />
<rect x="190" y="80" width="130" height="70" rx="4" fill="#FDF1B6" stroke="#E3CF78" stroke-width="1" filter="url(#soft)"/>
<text x="204" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3B3523" font-weight="600" text-anchor="start">Eggs</text>
<rect x="185" y="75" width="140" height="80" rx="10" fill="none" stroke="#2F6FEB" stroke-width="2" />
<rect x="340" y="80" width="130" height="70" rx="4" fill="#FDF1B6" stroke="#E3CF78" stroke-width="1" filter="url(#soft)"/>
<text x="354" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3B3523" font-weight="600" text-anchor="start">Coffee</text>
<rect x="335" y="75" width="140" height="80" rx="10" fill="none" stroke="#2F6FEB" stroke-width="2" />
<rect x="40" y="174" width="430" height="36" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<text x="54" y="197.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1F1F1E" font-weight="400" text-anchor="start">/move-to @Roa</text>
<line x1="172.89" y1="183" x2="172.89" y2="201" stroke="#2F6FEB" stroke-width="2"/>
<text x="456" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">3 shapes</text>
<rect x="125.26999999999998" y="218" width="300" height="72" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<rect x="130.26999999999998" y="225" width="290" height="28" rx="5" fill="#2F6FEB" stroke="none" stroke-width="1" />
<text x="141.26999999999998" y="244.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">▢</text>
<text x="163.26999999999998" y="244.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">Roadmap</text>
<text x="141.26999999999998" y="274.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#66665F" font-weight="400" text-anchor="start">▢</text>
<text x="163.26999999999998" y="274.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F1F1E" font-weight="400" text-anchor="start">Road trip</text>
<text x="411.27" y="274.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="end">Plans › 2026</text>
<text x="510" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">The @ list shows only places that</text>
<text x="510" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">can take all three.</text>
<path d="M502,182 L476,192" stroke="#B4B4AC" stroke-width="1" fill="none"/>
<circle cx="476" cy="192" r="2.5" fill="#B4B4AC"/>
<text x="40" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">Return picks Roadmap. Return again moves all three into it as one block,</text>
<text x="40" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">keeping their places relative to each other. Edit › Undo Move.</text>
</svg>
