<text x="40" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">Selected: three notes, the arrow between Milk and Eggs, and a reference (Pantry).</text>
<text x="40" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">A reference can&#x27;t have a color or a type; an arrow can&#x27;t be public and has no box to move</text>
<text x="40" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">(it moves with its notes anyway).</text>
