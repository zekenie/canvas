<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img">
<title>Typing in a note is unchanged</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9D9D3"/></pattern>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/></filter>
<filter id="soft" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A73"/></marker>
</defs>
<rect x="0" y="0" width="760" height="290" rx="10" fill="#F4F4F1" stroke="#E4E4DE" stroke-width="1" />
<rect x="0" y="0" width="760" height="290" rx="10" fill="url(#dots)" stroke="none" stroke-width="1" />
<text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1F1F1E" font-weight="700" text-anchor="start">Typing in a note: unchanged</text>
<rect x="40" y="76" width="300" height="180" rx="4" fill="#FDF1B6" stroke="#E3CF78" stroke-width="1" filter="url(#soft)"/>
<rect x="35" y="71" width="310" height="190" rx="8" fill="none" stroke="#2F6FEB" stroke-width="2" />
<text x="54" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3B3523" font-weight="400" text-anchor="start">Ask about the beta</text>
<text x="54" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#3B3523" font-weight="400" text-anchor="start">/lo</text>
<line x1="82.59" y1="114" x2="82.59" y2="132" stroke="#2F6FEB" stroke-width="2"/>
<rect x="50" y="140" width="180" height="42" rx="8" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" filter="url(#shadow)"/>
<rect x="55" y="147" width="170" height="28" rx="5" fill="#2F6FEB" stroke="none" stroke-width="1" />
<text x="66" y="166.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">lock</text>
<text x="390" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">While a note is being edited, / is the note&#x27;s:</text>
<text x="390" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">on an empty line it opens the list in the note,</text>
<text x="390" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#66665F" font-weight="400" text-anchor="start">exactly as today. No bar.</text>
<path d="M382,114 L346,126" stroke="#B4B4AC" stroke-width="1" fill="none"/>
<circle cx="346" cy="126" r="2.5" fill="#B4B4AC"/>
</svg>
